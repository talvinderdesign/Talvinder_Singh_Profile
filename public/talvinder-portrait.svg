<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#2a2d3a" />
      <stop offset="60%" stop-color="#11131a" />
      <stop offset="100%" stop-color="#090a0f" />
    </radialGradient>

    <!-- Turban Monochrome Shading -->
    <linearGradient id="turbanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="35%" stop-color="#94a3b8" />
      <stop offset="70%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="turbanHighlight" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#cbd5e1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Skin Contrast Shades -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d1d5db" />
      <stop offset="50%" stop-color="#9ca3af" />
      <stop offset="100%" stop-color="#4b5563" />
    </linearGradient>

    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Rim Light Glow -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" fill="url(#bgGlow)" rx="32" />

  <!-- Subtle Studio Backdrop Light Ring -->
  <circle cx="200" cy="180" r="140" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2" />
  <circle cx="200" cy="180" r="110" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" />

  <!-- Executive Shoulders / Suit -->
  <g id="body">
    <!-- Dark Executive Suit Coat -->
    <path d="M 90 380 Q 130 310 200 305 Q 270 310 310 380 Z" fill="url(#suitGrad)" stroke="#64748b" stroke-width="1" />
    <!-- Shirt Collar & V-Neck -->
    <path d="M 165 310 L 200 355 L 235 310 L 220 305 L 200 320 L 180 305 Z" fill="#f8fafc" />
    <!-- Dark Tie/Lapel -->
    <path d="M 192 320 L 208 320 L 204 380 L 196 380 Z" fill="#0f172a" />
  </g>

  <!-- Neck -->
  <path d="M 172 260 L 228 260 L 232 310 L 168 310 Z" fill="#64748b" />

  <!-- Head & Facial Features -->
  <g id="head">
    <!-- Face Base -->
    <path d="M 142 160 C 142 245 158 270 200 272 C 242 270 258 245 258 160 C 258 130 240 125 200 125 C 160 125 142 130 142 160 Z" fill="url(#skinGrad)" />

    <!-- Ears -->
    <ellipse cx="140" cy="180" rx="9" ry="16" fill="#64748b" />
    <ellipse cx="260" cy="180" rx="9" ry="16" fill="#64748b" />

    <!-- Classy Turban -->
    <g id="turban">
      <!-- Main Swirl / Folds of Turban -->
      <path d="M 125 145 Q 120 70 200 60 Q 280 70 275 145 Q 260 115 200 110 Q 140 115 125 145 Z" fill="url(#turbanGrad)" />
      <!-- Left Crown Fold -->
      <path d="M 125 145 C 130 90 170 65 200 62 C 165 85 140 115 135 150 Z" fill="url(#turbanHighlight)" />
      <!-- Right Crown Fold -->
      <path d="M 275 145 C 270 90 230 65 200 62 C 235 85 260 115 265 150 Z" fill="#1e293b" opacity="0.7" />
      <!-- Top Center Peak Wrap -->
      <path d="M 175 63 Q 200 50 225 63 Q 200 70 175 63 Z" fill="#f8fafc" opacity="0.9" />
      <!-- Front Lower Band -->
      <path d="M 135 138 Q 200 120 265 138 Q 255 128 200 122 Q 145 128 135 138 Z" fill="#f1f5f9" />
    </g>

    <!-- Eyebrows -->
    <path d="M 160 152 Q 175 147 185 152" fill="none" stroke="#0f172a" stroke-width="4" stroke-linecap="round" />
    <path d="M 215 152 Q 225 147 240 152" fill="none" stroke="#0f172a" stroke-width="4" stroke-linecap="round" />

    <!-- Eyes (Warm & Confident) -->
    <ellipse cx="172" cy="164" rx="7" ry="5" fill="#0f172a" />
    <circle cx="174" cy="163" r="2" fill="#ffffff" />
    <ellipse cx="228" cy="164" rx="7" ry="5" fill="#0f172a" />
    <circle cx="230" cy="163" r="2" fill="#ffffff" />

    <!-- Glasses (Classy Frame) -->
    <g id="glasses" stroke="#cbd5e1" stroke-width="2.5" fill="none">
      <!-- Left Lens Frame -->
      <rect x="156" y="154" width="32" height="22" rx="6" fill="#ffffff" fill-opacity="0.1" stroke="#e2e8f0" stroke-width="2" />
      <!-- Right Lens Frame -->
      <rect x="212" y="154" width="32" height="22" rx="6" fill="#ffffff" fill-opacity="0.1" stroke="#e2e8f0" stroke-width="2" />
      <!-- Bridge -->
      <path d="M 188 162 L 212 162" stroke="#e2e8f0" stroke-width="2.5" />
      <!-- Temples -->
      <path d="M 156 162 L 142 160" stroke="#94a3b8" />
      <path d="M 244 162 L 258 160" stroke="#94a3b8" />
      <!-- Lens Glare -->
      <line x1="160" y1="158" x2="172" y2="172" stroke="#ffffff" stroke-width="1.5" opacity="0.6" />
      <line x1="216" y1="158" x2="228" y2="172" stroke="#ffffff" stroke-width="1.5" opacity="0.6" />
    </g>

    <!-- Nose -->
    <path d="M 200 162 L 204 194 Q 198 198 194 194" fill="none" stroke="#475569" stroke-width="2.5" stroke-linecap="round" />

    <!-- Beard & Mustache (Neat, Full, Professional) -->
    <g id="beard">
      <!-- Full Beard outline -->
      <path d="M 144 180 Q 140 230 165 258 C 185 278 215 278 235 258 Q 260 230 256 180 C 252 220 235 268 200 268 C 165 268 148 220 144 180 Z" fill="#0f172a" />
      <!-- Mustache -->
      <path d="M 172 206 Q 192 198 200 206 Q 208 198 228 206 Q 212 216 200 214 Q 188 216 172 206 Z" fill="#090a0f" />
    </g>

    <!-- Pleasant, Confident Smile Lips -->
    <path d="M 182 212 Q 200 224 218 212" fill="none" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" />
    <!-- Smile creases -->
    <path d="M 168 204 Q 165 212 170 218" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 232 204 Q 235 212 230 218" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- High-Contrast Monochrome Overlay Vignette -->
  <rect width="400" height="400" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="4" rx="32" />
</svg>
